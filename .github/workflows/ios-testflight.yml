name: "iOS → TestFlight (firmado)"

# Fase 0: compila el iosApp actual, lo firma con la API key de App Store Connect y lo sube
# a TestFlight. Solo se ejecuta a mano desde la pestaña Actions.
#
# Reutiliza las mismas etapas que ios.yml (jars del runtime en Linux, OpenJDK en macos-14,
# app en macos-26). La primera corrida compila OpenJDK desde fuente (~45-60 min); después
# queda en caché.
#
# Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
# Variable opcional: BUNDLE_ID (por defecto cl.jonas.tachitest)

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  runtime:
    name: JVM runtime jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Restore compat jars
        id: compat-cache
        uses: actions/cache/restore@v4
        with:
          path: Runtime/ExtensionHost/compat
          key: suwayomi-compat-${{ hashFiles('iosApp/Scripts/bootstrap-suwayomi-compat.sh', 'iosApp/Scripts/patches/suwayomi-ios-runtime.patch', 'iosApp/Scripts/gradle/copy-suwayomi-runtime.init.gradle') }}

      - name: Bootstrap compat jars
        if: steps.compat-cache.outputs.cache-hit != 'true'
        run: bash iosApp/Scripts/bootstrap-suwayomi-compat.sh

      - name: Save compat jars
        if: steps.compat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Runtime/ExtensionHost/compat
          key: ${{ steps.compat-cache.outputs.cache-primary-key }}

      - name: Build runtime jars
        run: bash iosApp/Scripts/build-jvm-runtime.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-runtime-jars
          path: iosApp/Vendor/jars
          retention-days: 1

  openjdk:
    name: OpenJDK runtime
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore runtime cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            iosApp/Vendor/jvm/OpenJDK.xcframework
            iosApp/Vendor/jvm/java_bundle-device
            iosApp/Vendor/jvm/java_bundle-simulator
            iosApp/Vendor/jvm/.ios-runtime
          key: openjdk-ios-src-${{ runner.arch }}-${{ hashFiles('iosApp/Scripts/build-openjdk-ios15.sh', 'iosApp/Scripts/add-openjdk-static-lookup.sh', 'iosApp/Scripts/patches/openjdk-mobile-ios-runtime.patch', 'iosApp/Scripts/OpenJDK.exports') }}

      - name: Select Xcode
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Set up Java 24 boot JDK
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Build the runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          brew install autoconf make
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          bash iosApp/Scripts/build-openjdk-ios15.sh

      - name: Save runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            iosApp/Vendor/jvm/OpenJDK.xcframework
            iosApp/Vendor/jvm/java_bundle-device
            iosApp/Vendor/jvm/java_bundle-simulator
            iosApp/Vendor/jvm/.ios-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: openjdk-ios
          path: |
            iosApp/Vendor/jvm/OpenJDK.xcframework
            iosApp/Vendor/jvm/java_bundle-device
            iosApp/Vendor/jvm/java_bundle-simulator
            iosApp/Vendor/jvm/.ios-runtime
          retention-days: 1

  testflight:
    name: Archive firmado → TestFlight
    needs: [runtime, openjdk]
    runs-on: macos-26
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'cl.jonas.tachitest' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/download-artifact@v4
        with:
          name: jvm-runtime-jars
          path: iosApp/Vendor/jars

      - uses: actions/download-artifact@v4
        with:
          name: openjdk-ios
          path: iosApp/Vendor/jvm

      - name: Restore Texture
        id: texture-cache
        uses: actions/cache/restore@v4
        with:
          path: iosApp/Vendor/AsyncDisplayKit.xcframework
          key: texture-${{ hashFiles('iosApp/Scripts/fetch-texture.sh') }}

      - name: Fetch Texture
        if: steps.texture-cache.outputs.cache-hit != 'true'
        run: bash iosApp/Scripts/fetch-texture.sh

      - name: Save Texture
        if: steps.texture-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: iosApp/Vendor/AsyncDisplayKit.xcframework
          key: ${{ steps.texture-cache.outputs.cache-primary-key }}

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            shared-ios/build/XCFrameworks
          key: konan-${{ hashFiles('core-model/src/**', 'core-database/src/**', 'core-domain/src/**', 'shared-ios/build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: konan-

      - name: Build the shared framework
        run: ./gradlew :shared-ios:assembleTachiyomiKitDebugXCFramework --no-daemon

      - name: Stage the JVM runtime
        run: bash iosApp/Scripts/stage-jvm-resources.sh device

      # Ajusta el project.yml a tu cuenta sin tocarlo en git: bundle ID, equipo, ícono y
      # export compliance (sin cifrado propio), para que TestFlight no pregunte cada vez.
      - name: Ajustar project.yml para tu cuenta
        run: |
          cd iosApp
          perl -pi -e "s/PRODUCT_BUNDLE_IDENTIFIER: eu\.kanade\.tachiyomi\.az\.ios/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          perl -pi -e "s/DEVELOPMENT_TEAM: \w+/DEVELOPMENT_TEAM: $TEAM_ID/" project.yml
          perl -pi -e 's/ASSETCATALOG_COMPILER_APPICON_NAME: ""/ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon/' project.yml
          perl -pi -e 's/^(\s+)CFBundleDisplayName: TachiyomiAZ$/$1CFBundleDisplayName: TachiTest\n$1CFBundleIconName: AppIcon\n$1ITSAppUsesNonExemptEncryption: false/' project.yml
          grep -nE "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|APPICON|CFBundleIconName|CFBundleDisplayName|NonExempt" project.yml

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: iosApp/build-ci
          key: deriveddata-archive-${{ hashFiles('iosApp/project.yml', 'iosApp/Packages/*/Sources/**') }}
          restore-keys: deriveddata-archive-

      - name: Preparar API key de App Store Connect
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey.p8

      - name: Archive (firma automática con la API key)
        run: |
          cd iosApp
          xcodebuild \
            -project TachiyomiAZ.xcodeproj \
            -scheme TachiyomiAZ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ci \
            -archivePath build/TachiTest.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Exportar y subir a TestFlight
        run: |
          cd iosApp
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/TachiTest.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
